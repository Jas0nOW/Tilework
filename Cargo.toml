[package]
name = "cosmictile"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A small automatic tiling window manager for Windows"
readme = "README.md"
keywords = ["windows", "tiling", "window-manager"]

[dependencies]
windows = { version = "0.62.2", features = ["Win32_Security", "Win32_Storage_FileSystem", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_SystemInformation", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_RemoteDesktop", "Win32_UI_HiDpi"] }
